<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="Three agent windows working together. Claude Code hands the client work to Codex. Codex claims the file, does the work, and sends it back for Claude to check. OpenCode stays out of the claimed file and, reaching a step that drops a table, asks you instead of guessing. One decision waits for you; the agents handled the rest.">
  <title>agent-bus: your agents hand off work, check each other, and ask you only when it is your call</title>
  <style>
    .h { font: 600 30px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #f0f3f8; }
    .sub { font: 400 16px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8b95a7; }
    .wt { font: 600 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #c9d1dd; }
    .m { font: 400 13.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #c9d1dd; white-space: pre; }
    .dim { fill: #6b7588; }
    .ok { fill: #4ade80; }
    .cl { fill: #e8875f; }
    .cx { fill: #7cb0ff; }
    .oc { fill: #f5c451; }
    .you { fill: #c4a7ff; }
    .chip { font: 600 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .foot { font: 400 13.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #6b7588; }
  </style>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#151b26" stroke-width="1"/>
    </pattern>
    <marker id="aO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e8875f"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4ade80"/></marker>
    <marker id="aP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c4a7ff"/></marker>
  </defs>

  <rect width="1200" height="640" rx="20" fill="#0b0f17"/>
  <rect width="1200" height="640" rx="20" fill="url(#grid)"/>

  <text x="48" y="64" class="h">Your agents work together. You make the calls.</text>
  <text x="48" y="94" class="sub">Claude Code, Codex and OpenCode in separate windows and worktrees, handing work along one bus.</text>

  <!-- Window 1: Claude Code -->
  <g transform="translate(48 124)">
    <rect width="352" height="320" rx="10" fill="#111723" stroke="#252e3e"/>
    <path d="M0 10a10 10 0 0 1 10-10h332a10 10 0 0 1 10 10v22H0z" fill="#171e2c"/>
    <circle cx="18" cy="16" r="4.5" fill="#e8875f"/>
    <text x="32" y="21" class="wt">Claude Code · checkout-api</text>
    <text x="16" y="64" class="m"><tspan class="cl">›</tspan> hand the client work to Codex</text>
    <text x="16" y="86" class="m dim">  delivery: codex/web — woken</text>
    <text x="16" y="130" class="m"><tspan class="ok">◈</tspan> codex/web: done. Client wired,</text>
    <text x="16" y="152" class="m">  14 tests pass. Check it?</text>
    <text x="16" y="196" class="m"><tspan class="cl">›</tspan> looks right, approve it</text>
    <text x="16" y="218" class="m ok">  ✓ accepted · item closed</text>
    <text x="16" y="296" class="m dim">  nothing else waits on you</text>
  </g>

  <!-- Window 2: Codex -->
  <g transform="translate(424 124)">
    <rect width="352" height="320" rx="10" fill="#111723" stroke="#252e3e"/>
    <path d="M0 10a10 10 0 0 1 10-10h332a10 10 0 0 1 10 10v22H0z" fill="#171e2c"/>
    <circle cx="18" cy="16" r="4.5" fill="#7cb0ff"/>
    <text x="32" y="21" class="wt">Codex · checkout-web</text>
    <text x="16" y="64" class="m"><tspan class="cl">◈</tspan> handoff from claude/api</text>
    <text x="16" y="86" class="m">  wire the client to /checkout</text>
    <text x="16" y="130" class="m"><tspan class="cx">●</tspan> claimed src/client.ts</text>
    <text x="16" y="152" class="m"><tspan class="cx">●</tspan> editing src/client.ts</text>
    <text x="16" y="174" class="m"><tspan class="cx">●</tspan> 14 tests passed</text>
    <text x="16" y="218" class="m"><tspan class="cx">›</tspan> agent-bus reply &lt;id&gt; -m "done"</text>
    <text x="16" y="240" class="m ok">  → back to claude/api to check</text>
  </g>

  <!-- Window 3: OpenCode -->
  <g transform="translate(800 124)">
    <rect width="352" height="320" rx="10" fill="#111723" stroke="#252e3e"/>
    <path d="M0 10a10 10 0 0 1 10-10h332a10 10 0 0 1 10 10v22H0z" fill="#171e2c"/>
    <circle cx="18" cy="16" r="4.5" fill="#f5c451"/>
    <text x="32" y="21" class="wt">OpenCode · billing</text>
    <text x="16" y="64" class="m"><tspan class="oc">●</tspan> invoices: move to the v2 schema</text>
    <text x="16" y="108" class="m"><tspan class="cx">◈</tspan> src/client.ts is claimed by</text>
    <text x="16" y="130" class="m">  codex/web. Leaving it alone.</text>
    <text x="16" y="174" class="m"><tspan class="oc">●</tspan> next step drops a table.</text>
    <text x="16" y="196" class="m">  That's your call, not mine.</text>
    <text x="16" y="240" class="m"><tspan class="oc">›</tspan> agent-bus ask --to @lead</text>
    <text x="16" y="262" class="m you">  waiting for you…</text>
  </g>

  <!-- The bus -->
  <line x1="48" y1="508" x2="1152" y2="508" stroke="#2a3446" stroke-width="2"/>
  <g stroke="#2a3446" stroke-width="2">
    <line x1="224" y1="444" x2="224" y2="508"/>
    <line x1="600" y1="444" x2="600" y2="508"/>
    <line x1="976" y1="444" x2="976" y2="508"/>
  </g>
  <g fill="#0b0f17" stroke-width="2">
    <circle cx="224" cy="508" r="6" stroke="#e8875f"/>
    <circle cx="600" cy="508" r="6" stroke="#7cb0ff"/>
    <circle cx="976" cy="508" r="6" stroke="#f5c451"/>
  </g>

  <!-- handoff: Claude → Codex -->
  <path d="M244 484H580" stroke="#e8875f" stroke-width="2" fill="none" marker-end="url(#aO)"/>
  <rect x="337" y="471" width="150" height="26" rx="13" fill="#2a1a12" stroke="#e8875f"/>
  <text x="412" y="488.5" text-anchor="middle" class="chip cl">handoff</text>
  <!-- back to check: Codex → Claude -->
  <path d="M580 532H244" stroke="#4ade80" stroke-width="2" fill="none" marker-end="url(#aG)"/>
  <rect x="317" y="519" width="190" height="26" rx="13" fill="#0f2418" stroke="#4ade80"/>
  <text x="412" y="536.5" text-anchor="middle" class="chip ok">done · check it</text>
  <!-- claim: Codex ↔ OpenCode -->
  <path d="M620 484H956" stroke="#7cb0ff" stroke-width="2" stroke-dasharray="5 5" fill="none"/>
  <rect x="693" y="471" width="190" height="26" rx="13" fill="#111f36" stroke="#7cb0ff"/>
  <text x="788" y="488.5" text-anchor="middle" class="chip cx">claim src/client.ts</text>

  <!-- question: OpenCode → you -->
  <path d="M976 514V566" stroke="#c4a7ff" stroke-width="2" fill="none" marker-end="url(#aP)"/>
  <rect x="742" y="572" width="410" height="40" rx="20" fill="#1d1533" stroke="#c4a7ff"/>
  <text x="764" y="597" class="chip you">YOU</text>
  <text x="802" y="597" class="m">1 decision: drop the legacy table?</text>

  <text x="48" y="597" class="foot">no server · one script + jq · an append-only log in ~/.agents/bus/</text>
</svg>
