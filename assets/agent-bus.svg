<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="A yellow school bus labeled AGENT BUS with robot agents in the windows, a PM robot driving, a roof sign reading @here to @repo, and a handoff packet flying out behind.">
  <title>agent-bus — a school bus full of coding agents</title>

  <!-- ground shadow -->
  <ellipse cx="440" cy="374" rx="340" ry="14" fill="#888888" opacity="0.22"/>

  <!-- exhaust puffs -->
  <circle cx="46" cy="326" r="10" fill="#9aa0a6" opacity="0.5"/>
  <circle cx="26" cy="318" r="7" fill="#9aa0a6" opacity="0.35"/>
  <circle cx="12" cy="310" r="5" fill="#9aa0a6" opacity="0.25"/>

  <!-- handoff packet flying out the back -->
  <g>
    <line x1="-6" y1="176" x2="8" y2="176" stroke="#9aa0a6" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <line x1="-2" y1="190" x2="10" y2="190" stroke="#9aa0a6" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <rect x="18" y="164" width="38" height="28" rx="4" fill="#ffffff" stroke="#262a31" stroke-width="2.5"/>
    <path d="M18 168 L37 184 L56 168" fill="none" stroke="#262a31" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- roof route sign -->
  <rect x="560" y="64" width="220" height="40" rx="8" fill="#1c1f26" stroke="#5a6470" stroke-width="2.5"/>
  <text x="670" y="91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="700" fill="#ffb01f">@here &#8594; @repo</text>

  <!-- roof marker lights -->
  <rect x="116" y="98" width="26" height="12" rx="6" fill="#ffb01f" stroke="#262a31" stroke-width="2.5"/>
  <rect x="446" y="98" width="26" height="12" rx="6" fill="#ffb01f" stroke="#262a31" stroke-width="2.5"/>

  <!-- bus body -->
  <rect x="80" y="108" width="710" height="200" rx="22" fill="#ffc42e" stroke="#262a31" stroke-width="4"/>

  <!-- bumpers -->
  <rect x="62" y="280" width="24" height="26" rx="6" fill="#3c434d" stroke="#262a31" stroke-width="2.5"/>
  <rect x="784" y="280" width="24" height="26" rx="6" fill="#3c434d" stroke="#262a31" stroke-width="2.5"/>

  <!-- passenger windows -->
  <rect x="104" y="138" width="96" height="74" rx="10" fill="#bee3f8" stroke="#262a31" stroke-width="3"/>
  <rect x="222" y="138" width="96" height="74" rx="10" fill="#bee3f8" stroke="#262a31" stroke-width="3"/>
  <rect x="340" y="138" width="96" height="74" rx="10" fill="#bee3f8" stroke="#262a31" stroke-width="3"/>
  <rect x="458" y="138" width="96" height="74" rx="10" fill="#bee3f8" stroke="#262a31" stroke-width="3"/>
  <!-- driver window + windshield -->
  <rect x="576" y="138" width="96" height="74" rx="10" fill="#bee3f8" stroke="#262a31" stroke-width="3"/>
  <rect x="694" y="128" width="66" height="92" rx="10" fill="#bee3f8" stroke="#262a31" stroke-width="3"/>

  <!-- robot passengers (generic bots, harness-hinted colors) -->
  <!-- coral bot -->
  <g>
    <line x1="152" y1="162" x2="152" y2="150" stroke="#262a31" stroke-width="3"/>
    <circle cx="152" cy="147" r="5" fill="#e07a5f" stroke="#262a31" stroke-width="2.5"/>
    <rect x="126" y="162" width="52" height="50" rx="10" fill="#e07a5f" stroke="#262a31" stroke-width="3"/>
    <circle cx="141" cy="184" r="7" fill="#ffffff"/><circle cx="141" cy="184" r="3" fill="#1c1f26"/>
    <circle cx="163" cy="184" r="7" fill="#ffffff"/><circle cx="163" cy="184" r="3" fill="#1c1f26"/>
    <rect x="145" y="198" width="14" height="4" rx="2" fill="#1c1f26" opacity="0.75"/>
  </g>
  <!-- teal bot -->
  <g>
    <line x1="270" y1="162" x2="270" y2="150" stroke="#262a31" stroke-width="3"/>
    <circle cx="270" cy="147" r="5" fill="#17a385" stroke="#262a31" stroke-width="2.5"/>
    <rect x="244" y="162" width="52" height="50" rx="10" fill="#17a385" stroke="#262a31" stroke-width="3"/>
    <circle cx="259" cy="184" r="7" fill="#ffffff"/><circle cx="259" cy="184" r="3" fill="#1c1f26"/>
    <circle cx="281" cy="184" r="7" fill="#ffffff"/><circle cx="281" cy="184" r="3" fill="#1c1f26"/>
    <rect x="263" y="198" width="14" height="4" rx="2" fill="#1c1f26" opacity="0.75"/>
  </g>
  <!-- charcoal bot -->
  <g>
    <line x1="388" y1="162" x2="388" y2="150" stroke="#262a31" stroke-width="3"/>
    <circle cx="388" cy="147" r="5" fill="#2d333b" stroke="#262a31" stroke-width="2.5"/>
    <rect x="362" y="162" width="52" height="50" rx="10" fill="#2d333b" stroke="#262a31" stroke-width="3"/>
    <circle cx="377" cy="184" r="7" fill="#ffffff"/><circle cx="377" cy="184" r="3" fill="#1c1f26"/>
    <circle cx="399" cy="184" r="7" fill="#ffffff"/><circle cx="399" cy="184" r="3" fill="#1c1f26"/>
    <rect x="381" y="198" width="14" height="4" rx="2" fill="#ffffff" opacity="0.75"/>
  </g>
  <!-- terminal-green bot -->
  <g>
    <line x1="506" y1="162" x2="506" y2="150" stroke="#262a31" stroke-width="3"/>
    <circle cx="506" cy="147" r="5" fill="#3fb950" stroke="#262a31" stroke-width="2.5"/>
    <rect x="480" y="162" width="52" height="50" rx="10" fill="#3fb950" stroke="#262a31" stroke-width="3"/>
    <circle cx="495" cy="184" r="7" fill="#ffffff"/><circle cx="495" cy="184" r="3" fill="#1c1f26"/>
    <circle cx="517" cy="184" r="7" fill="#ffffff"/><circle cx="517" cy="184" r="3" fill="#1c1f26"/>
    <rect x="499" y="198" width="14" height="4" rx="2" fill="#1c1f26" opacity="0.75"/>
  </g>
  <!-- PM driver -->
  <g>
    <rect x="598" y="166" width="52" height="46" rx="10" fill="#8b949e" stroke="#262a31" stroke-width="3"/>
    <path d="M598 170 a26 18 0 0 1 52 0 v4 h-52 z" fill="#1c1f26"/>
    <rect x="644" y="168" width="16" height="6" rx="3" fill="#1c1f26"/>
    <text x="624" y="179" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#ffffff">PM</text>
    <circle cx="613" cy="192" r="6" fill="#ffffff"/><circle cx="613" cy="192" r="3" fill="#1c1f26"/>
    <circle cx="635" cy="192" r="6" fill="#ffffff"/><circle cx="635" cy="192" r="3" fill="#1c1f26"/>
    <rect x="617" y="202" width="14" height="4" rx="2" fill="#1c1f26" opacity="0.75"/>
  </g>

  <!-- lettering -->
  <text x="330" y="248" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="31" font-weight="900" letter-spacing="8" fill="#1c1f26">AGENT BUS</text>

  <!-- stop arm -->
  <g>
    <polygon points="705,226 719,226 729,236 729,250 719,260 705,260 695,250 695,236" fill="#d93025" stroke="#262a31" stroke-width="2.5"/>
    <text x="712" y="248" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#ffffff">STOP</text>
  </g>

  <!-- rub rails -->
  <rect x="80" y="258" width="710" height="10" rx="5" fill="#262a31" opacity="0.9"/>
  <rect x="80" y="276" width="710" height="6" rx="3" fill="#262a31" opacity="0.9"/>

  <!-- rear plate -->
  <rect x="94" y="286" width="62" height="20" rx="4" fill="#ffffff" stroke="#262a31" stroke-width="2"/>
  <text x="125" y="301" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#1c1f26">BASH+JQ</text>

  <!-- headlight -->
  <circle cx="774" cy="250" r="9" fill="#ffe8a3" stroke="#262a31" stroke-width="2.5"/>

  <!-- wheels -->
  <g>
    <circle cx="208" cy="308" r="50" fill="#1c1f26" stroke="#5a6470" stroke-width="3"/>
    <circle cx="208" cy="308" r="42" fill="#262a31" stroke="#000000" stroke-width="2"/>
    <circle cx="208" cy="308" r="17" fill="#8b949e" stroke="#000000" stroke-width="2"/>
    <circle cx="208" cy="308" r="5" fill="#1c1f26"/>
  </g>
  <g>
    <circle cx="648" cy="308" r="50" fill="#1c1f26" stroke="#5a6470" stroke-width="3"/>
    <circle cx="648" cy="308" r="42" fill="#262a31" stroke="#000000" stroke-width="2"/>
    <circle cx="648" cy="308" r="17" fill="#8b949e" stroke="#000000" stroke-width="2"/>
    <circle cx="648" cy="308" r="5" fill="#1c1f26"/>
  </g>
</svg>
