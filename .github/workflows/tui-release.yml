# Attaches the TUI binary for each platform to a published release, so the
# curl installer can download it. Homebrew builds it from source instead.
name: tui-release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: release tag to attach binaries to
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: tui/go.mod
      - name: test
        working-directory: tui
        run: go test ./...
      - name: build
        working-directory: tui
        run: |
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os=${target%/*}; arch=${target#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${TAG#v}" -o "../dist/agent-bus-tui-$os-$arch" .
          done
      - name: upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber
